# SLAT-YOLO single-class nano configuration. See README.md.

nc: 1
scales:
  n: [0.50, 0.25, 1024]

# Explicit loss selection; upstream YOLO models continue to use CIoU.
bbox_loss:
  type: wise_shapeiou
  scale: 0.0
  momentum: 0.01
  alpha: 1.7
  delta: 2.7

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, "C3k2", [256, false, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, "C3k2", [512, false, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, "C3k2", [512, true]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, "C3k2", [1024, true]]
  - [-1, 1, "SPPF", [1024, 5]]
  - [-1, 2, "C2PSA", [1024]]

head:
  # [from, repeats, module, args]
  - [-1, 1, "nn.Upsample", ["None", 2, "nearest"]]
  - [[-1, 6], 1, "Concat", [1]]
  - [-1, 2, "C3k2", [512, false]]
  - [-1, 1, "nn.Upsample", ["None", 2, "nearest"]]
  - [[-1, 4], 1, "Concat", [1]]
  - [-1, 2, "C3k2", [256, false]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, "Concat", [1]]
  - [-1, 2, "C3k2", [512, false]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, "Concat", [1]]
  - [-1, 2, "C3k2", [1024, true]]
  - [[16, 19, 22], 1, "Detect", [nc]]
